# Baut eine unsignierte iOS-App (.ipa) auf einem Mac in der Cloud.
# Signiert und installiert wird sie danach auf dem PC mit Sideloadly und der eigenen Apple-ID.
name: iOS-Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['modules/**', 'app.json', 'package.json', 'package-lock.json', '.github/workflows/ios-build.yml']

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Nativen iOS-Ordner erzeugen (inkl. pod install)
        run: npx expo prebuild --platform ios --clean

      - name: App bauen (ohne Signatur)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: .ipa packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/*.app Payload/
          zip -qry SnapchatAufWish.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SnapchatAufWish-ipa
          path: SnapchatAufWish.ipa
          retention-days: 14
